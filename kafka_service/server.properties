# Kafka Server Configuration for Fraud Detection Platform

# Broker Identification
broker.id=${KAFKA_BROKER_ID:1}

# Network Configuration
listeners=PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
advertised.listeners=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
inter.broker.listener.name=PLAINTEXT

# Zookeeper Configuration
zookeeper.connect=${KAFKA_ZOOKEEPER_CONNECT:zookeeper:2181}
zookeeper.connection.timeout.ms=6000

# Log Configuration
log.dirs=/var/lib/kafka/data
log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000

# Topic Configuration
num.partitions=3
default.replication.factor=1
min.insync.replicas=1
auto.create.topics.enable=true

# Performance Configuration
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

# Group Coordinator Configuration
group.initial.rebalance.delay.ms=0

# Transaction Configuration
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
transaction.state.log.num.partitions=1

# Security Configuration (disabled for development)
security.inter.broker.protocol=PLAINTEXT

# Metrics Configuration
metric.reporters=
metrics.num.samples=2
metrics.sample.window.ms=30000